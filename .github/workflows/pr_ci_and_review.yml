name: PR CI + Reviewer Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -U pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check .

      - name: Black (check)
        run: black --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -q

      - name: pip-audit
        run: pip-audit -r <(python -c "import pkgutil; print('')") || true

  reviewer:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -U pip
          pip install -e .[dev]

      - name: Run Reviewer Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE }}
          LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS }}
          CI_CONCLUSION: ${{ needs.quality.result }}
        run: |
          python -m sdlc_agents.cli reviewer --pr-number "${{ github.event.pull_request.number }}" --ci-conclusion "${CI_CONCLUSION}"

      - name: Upload reviewer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reviewer-report
          path: agent_reports/
          if-no-files-found: ignore
